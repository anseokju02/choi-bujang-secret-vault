<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 오프라인 안내</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #101a28; color: #ecf4ff; font-family: system-ui, sans-serif; }
    main { max-width: 520px; padding: 28px; }
    p { color: #bfd0e5; line-height: 1.7; }
    button { padding: 12px 18px; border: 0; border-radius: 8px;
      background: #8ad8df; color: #101a28; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>인터넷 연결이 필요합니다</h1>
    <p>자료실은 로그인과 기기 승인 상태를 서버에서 확인한 뒤 엽니다. 네트워크 연결을 복구하고 다시 시도해 주세요. 이 오프라인 안내에는 보호 자료가 없습니다.</p>
    <button type="button" onclick="location.reload()">다시 연결</button>
  </main>
</body>
</html>
