
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 로그인 자료실</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 44px 22px 64px;
    }
    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
    }
    h1 {
      font-size: clamp(30px, 7vw, 48px);
      margin: 16px 0;
    }
    h2 { font-size: 22px; }
    p {
      color: #bfd0e5;
      line-height: 1.7;
    }
    .notice {
      padding: 18px;
      margin: 26px 0;
      border: 1px solid #d07384;
      border-radius: 14px;
      background: #612a3544;
      color: #ffe3e8;
    }
    .panel, li {
      background: #1a2a3d;
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    form {
      display: grid;
      gap: 12px;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      background: #101a28;
      color: #ecf4ff;
      border: 1px solid #71849a;
      border-radius: 8px;
      font: inherit;
    }
    button {
      padding: 10px 16px;
      background: #8ad8df;
      color: #101a28;
      border: 0;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary {
      background: #71849a;
      color: white;
    }
    .danger {
      background: #d07384;
      color: #101a28;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li strong {
      display: block;
      margin-bottom: 6px;
    }
    li span {
      color: #bfd0e5;
      white-space: pre-wrap;
    }
    .feedback {
      min-height: 24px;
      color: #8ad8df;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>로그인 자료실</h1>
    <p>실습용 가상 메모를 관리하는 자료실입니다.</p>

    <div class="notice">
      서버에서 로그인 토큰을 확인합니다.
      다만 다른 사용자의 메모에 대한 개별 소유권 검사는
      아직 완성되지 않았으며 4단계에서 보완합니다.
    </div>

    <section class="panel">
      <h2>사용자 인증</h2>
      <p id="auth-status" role="status">
        로그인 상태를 확인하는 중입니다.
      </p>

      <form id="login-form" hidden>
        <label for="email">이메일</label>
        <input id="email" type="email"
               autocomplete="username" required>

        <label for="password">비밀번호</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button id="login-button" type="submit">
          로그인
        </button>
      </form>

      <button id="logout-button" type="button" hidden>
        로그아웃
      </button>

      <p id="feedback" class="feedback" role="alert"></p>
    </section>

    <section id="notes-panel" hidden>
      <div class="panel">
        <h2 id="editor-heading">가상 메모 추가</h2>

        <form id="note-form">
          <label for="note-title">제목</label>
          <input id="note-title" maxlength="200" required>

          <label for="note-body">내용</label>
          <textarea id="note-body" rows="4"
                    maxlength="5000"></textarea>

          <button id="save-note" type="submit">
            메모 추가
          </button>

          <button id="cancel-edit" type="button"
                  class="secondary" hidden>
            수정 취소
          </button>
        </form>

        <p id="note-feedback" class="feedback"
           role="status"></p>
      </div>

      <h2>가상 메모 목록</h2>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL =
      'https://poliizqzubueodtcfomw.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_DkRgET2pKrXpq5pbbtiDag__Wfa6V4Z';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = selector => document.querySelector(selector);

    const loginForm = $('#login-form');
    const logoutButton = $('#logout-button');
    const notesPanel = $('#notes-panel');
    const noteForm = $('#note-form');
    const list = $('#notes');

    let activeToken = null;
    let editingId = null;

    async function apiRequest(path, method = 'GET', body,
                              token = activeToken) {
      if (!token) throw new Error('로그인이 필요합니다.');

      const headers = {
        Authorization: `Bearer ${token}`
      };

      if (body !== undefined) {
        headers['Content-Type'] = 'application/json';
      }

      const response = await fetch(path, {
        method,
        headers,
        cache: 'no-store',
        body: body === undefined
          ? undefined
          : JSON.stringify(body)
      });

      if (response.status === 204) return null;

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          `${data.error ?? 'REQUEST_FAILED'} (HTTP ${response.status})`
        );
      }

      return data;
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      $('#editor-heading').textContent = '가상 메모 추가';
      $('#save-note').textContent = '메모 추가';
      $('#cancel-edit').hidden = true;
    }

    async function loadNotes(token = activeToken) {
      list.replaceChildren();

      const loading = document.createElement('li');
      loading.textContent = '메모를 불러오는 중입니다.';
      list.append(loading);

      try {
        const data = await apiRequest(
          '/api/notes', 'GET', undefined, token
        );

        if (activeToken !== token) return;

        if (!Array.isArray(data.notes)) {
          throw new Error('메모 목록 형식이 올바르지 않습니다.');
        }

        list.replaceChildren();

        if (data.notes.length === 0) {
          const empty = document.createElement('li');
          empty.textContent = '등록된 메모가 없습니다.';
          list.append(empty);
          return;
        }

        for (const note of data.notes) {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          const actions = document.createElement('div');

          title.textContent = note.title;
          content.textContent = note.content;
          actions.className = 'actions';

          const editButton = document.createElement('button');
          editButton.textContent = '수정';
          editButton.type = 'button';

          editButton.addEventListener('click', async () => {
            try {
              const detail = await apiRequest(
                `/api/notes/${encodeURIComponent(note.id)}`
              );

              editingId = detail.id;
              $('#note-title').value = detail.title;
              $('#note-body').value = detail.body;
              $('#editor-heading').textContent = '가상 메모 수정';
              $('#save-note').textContent = '수정 저장';
              $('#cancel-edit').hidden = false;
              $('#note-feedback').textContent =
                '수정 후 저장 버튼을 눌러주세요.';
              $('#note-title').focus();
            } catch (error) {
              $('#note-feedback').textContent = error.message;
            }
          });

          const deleteButton = document.createElement('button');
          deleteButton.textContent = '삭제';
          deleteButton.type = 'button';
          deleteButton.className = 'danger';

          deleteButton.addEventListener('click', async () => {
            if (!confirm(`"${note.title}" 메모를 삭제할까요?`)) {
              return;
            }

            try {
              await apiRequest(
                `/api/notes/${encodeURIComponent(note.id)}`,
                'DELETE'
              );

              if (editingId === note.id) resetEditor();

              $('#note-feedback').textContent = '메모가 삭제됐습니다.';
              await loadNotes();
            } catch (error) {
              $('#note-feedback').textContent = error.message;
            }
          });

          actions.append(editButton, deleteButton);
          item.append(title, content, actions);
          list.append(item);
        }
      } catch (error) {
        if (activeToken !== token) return;

        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();

      const title = $('#note-title').value.trim();
      const body = $('#note-body').value;
      const id = editingId;
      const button = $('#save-note');

      button.disabled = true;
      $('#note-feedback').textContent = '저장하는 중입니다.';

      try {
        if (id) {
          await apiRequest(
            `/api/notes/${encodeURIComponent(id)}`,
            'PUT',
            { title, body }
          );
        } else {
          await apiRequest(
            '/api/notes',
            'POST',
            { title, body }
          );
        }

        resetEditor();
        $('#note-feedback').textContent =
          id ? '메모를 수정했습니다.' : '메모를 추가했습니다.';

        await loadNotes();
      } catch (error) {
        $('#note-feedback').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    $('#cancel-edit').addEventListener('click', () => {
      resetEditor();
      $('#note-feedback').textContent = '수정을 취소했습니다.';
    });

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();

      const button = $('#login-button');
      button.disabled = true;
      $('#feedback').textContent = '로그인 확인 중입니다.';

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: $('#email').value,
          password: $('#password').value
        });

        if (error) {
          $('#feedback').textContent =
            '로그인 실패: 이메일과 비밀번호를 확인하세요.';
        }
      } catch {
        $('#feedback').textContent =
          '로그인 서버에 연결하지 못했습니다.';
      } finally {
        $('#password').value = '';
        button.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;

      try {
        const { error } = await supabase.auth.signOut();
        if (error) throw error;
      } catch {
        $('#feedback').textContent = '로그아웃에 실패했습니다.';
      } finally {
        logoutButton.disabled = false;
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      const loggedIn = Boolean(session?.user);
      activeToken = session?.access_token ?? null;

      loginForm.hidden = loggedIn;
      logoutButton.hidden = !loggedIn;
      notesPanel.hidden = !loggedIn;
      $('#feedback').textContent = '';

      if (loggedIn) {
        $('#auth-status').textContent =
          `로그인됨: ${session.user.email}`;
        void loadNotes(activeToken);
      } else {
        $('#auth-status').textContent =
          '로그인하지 않았습니다. 이메일과 비밀번호를 입력하세요.';
        list.replaceChildren();
        resetEditor();
      }
    });
  </script>
</body>
</html>
